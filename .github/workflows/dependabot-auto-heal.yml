name: Dependabot Auto-Heal

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-heal-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  auto-heal:
    name: Auto-fix Dependabot PR
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Ensure TypeScript compatibility
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            let modified = false;
            if (pkg.devDependencies && pkg.devDependencies.typescript) {
              const version = pkg.devDependencies.typescript.replace(/[\^~]/, "");
              const major = parseInt(version.split(".")[0], 10);
              if (major >= 7) {
                console.log("TypeScript >=7 detected (" + pkg.devDependencies.typescript + "). Pinning devDependencies.typescript to ^6.0.3 for ESLint compatibility...");
                pkg.devDependencies.typescript = "^6.0.3";
                modified = true;
              }
            }
            if (modified) {
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
              console.log("package.json updated with typescript ^6.0.3.");
            } else {
              console.log("TypeScript version is already compatible.");
            }
          '

      - name: Install dependencies
        run: npm install

      - name: Auto-fix linting and audit issues
        run: |
          echo "Attempting ESLint auto-fixes..."
          npm run lint:fix || true

          echo "Attempting safe dependency audit fixes..."
          npm audit fix || true

      - name: Commit and push fixes back to Dependabot branch
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected after auto-heal. Committing and pushing to ${{ github.head_ref }}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(deps): auto-heal dependabot updates [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
            echo "Successfully pushed auto-healed changes to ${{ github.head_ref }}."
          else
            echo "No changes required; branch is clean."
          fi
