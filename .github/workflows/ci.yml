name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Run lint (with auto-fix on failure)
        run: |
          if ! npm run lint; then
            echo "::warning::ESLint check failed. Attempting automatic fix using 'npm run lint:fix'..."
            npm run lint:fix || true

            if [ -n "$(git status --porcelain)" ]; then
              echo "Applying auto-fixes and committing changes..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "style: auto-fix eslint issues [skip ci]"

              TARGET_REF="${{ github.head_ref || github.ref_name }}"
              echo "Target branch: $TARGET_REF"

              if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
                echo "::warning::Pull request originates from a fork repository. Automatic push skipped."
              else
                git push origin HEAD:"$TARGET_REF"
                echo "Auto-fixed lint changes successfully pushed to $TARGET_REF."
              fi
            else
              echo "No auto-fixable changes detected."
            fi

            echo "Re-running ESLint to verify remaining issues..."
            npm run lint
          fi


  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/budgety?sslmode=disable
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-budgety.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-budgety
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-budgety.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci-build-placeholder

